name: oneplus-enchilada-wcd934x

on:
  push:
    branches: [main]
    paths:
      - 'devices/oneplus-enchilada/audio/wcd934x-mic/**'
      - '.github/workflows/oneplus-enchilada-wcd934x.yml'
  pull_request:
    paths:
      - 'devices/oneplus-enchilada/audio/wcd934x-mic/**'
      - '.github/workflows/oneplus-enchilada-wcd934x.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  FIX_DIR: devices/oneplus-enchilada/audio/wcd934x-mic

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel_tag: sdm845-6.16.7-r0
            config: kernel-6.16.7.config
            label: 6.16.7
          - kernel_tag: sdm845-7.1-rc1-r0
            config: kernel-7.1.config
            label: 7.1-rc1

    steps:
      - uses: actions/checkout@v4

      - name: Cache kernel source tarball
        uses: actions/cache@v4
        with:
          path: linux-${{ matrix.kernel_tag }}.tar.gz
          key: kernel-${{ matrix.kernel_tag }}

      - name: Download kernel source
        run: |
          set -e
          if [ ! -f "linux-${{ matrix.kernel_tag }}.tar.gz" ]; then
            curl -fL -o "linux-${{ matrix.kernel_tag }}.tar.gz" \
              "https://gitlab.com/sdm845-mainline/linux/-/archive/${{ matrix.kernel_tag }}/linux-${{ matrix.kernel_tag }}.tar.gz"
          fi
          tar xzf "linux-${{ matrix.kernel_tag }}.tar.gz"

      - name: Prepare source
        run: |
          set -e
          cd "linux-${{ matrix.kernel_tag }}"
          cp "../$FIX_DIR/config/${{ matrix.config }}" .config
          patch -p1 < "../$FIX_DIR/patches/0001-ASoC-codecs-wcd934x-enable-MCLK-for-the-capture-path.patch"
          # BTF is not needed for a loadable module and would require pahole + vmlinux.
          if grep -q '^CONFIG_DEBUG_INFO_BTF=y' .config; then
            ./scripts/config --file .config -d DEBUG_INFO_BTF -d DEBUG_INFO_BTF_MODULES
          fi

      - name: Build module (Alpine clang, same as pmOS)
        run: |
          set -e
          mkdir -p out
          docker run --rm -u 0 \
            -v "$PWD:/src" \
            -w "/src/linux-${{ matrix.kernel_tag }}" \
            alpine:3.23 sh -c '
              set -e
              apk add --no-cache build-base clang lld llvm make bc bison flex perl \
                openssl openssl-dev elfutils-dev zstd python3 kmod >/dev/null
              make ARCH=arm64 LLVM=1 olddefconfig
              make ARCH=arm64 LLVM=1 \
                HOSTCFLAGS_sign-file.o="-I$(pwd)/include/uapi -I$(pwd)/arch/arm64/include/uapi -I$(pwd)/arch/arm64/include/generated/uapi -I$(pwd)/tools/include/uapi" \
                modules_prepare -j"$(nproc)"
              make ARCH=arm64 LLVM=1 \
                HOSTCFLAGS_sign-file.o="-I$(pwd)/include/uapi -I$(pwd)/arch/arm64/include/uapi -I$(pwd)/arch/arm64/include/generated/uapi -I$(pwd)/tools/include/uapi" \
                M=sound/soc/codecs KBUILD_MODPOST_WARN=1 modules -j"$(nproc)"
              modinfo -F vermagic sound/soc/codecs/snd-soc-wcd934x.ko > /src/out/VERMAGIC.txt
              zstd -19 -f -o /src/out/snd-soc-wcd934x.ko.zst \
                sound/soc/codecs/snd-soc-wcd934x.ko
            '

      - name: Package
        run: |
          set -e
          cd out
          sha256sum snd-soc-wcd934x.ko.zst > snd-soc-wcd934x.ko.zst.sha256
          cp "../$FIX_DIR/ucm/HiFi.conf" "../$FIX_DIR/ucm/VoiceCall.conf" .
          KVER=$(sed 's/ .*//' VERMAGIC.txt)
          cat > INSTALL.txt <<EOF
          Kernel tag: ${{ matrix.kernel_tag }}
          Vermagic:   $(cat VERMAGIC.txt)

          Install on the phone:
            sudo cp snd-soc-wcd934x.ko.zst /lib/modules/${KVER}/kernel/sound/soc/codecs/
            sudo depmod -a ${KVER}
            sudo cp HiFi.conf /usr/share/alsa/ucm2/OnePlus/enchilada/HiFi.conf
            sudo cp VoiceCall.conf /usr/share/alsa/ucm2/OnePlus/enchilada/VoiceCall.conf
            sudo reboot
          EOF

      - name: Show artifact
        run: ls -lh out/

      - uses: actions/upload-artifact@v4
        with:
          name: oneplus-enchilada-wcd934x-${{ matrix.label }}
          path: out/
          if-no-files-found: error
          retention-days: 30
